name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts skips compiling the native RakNet addon, which needs a
      # cmake toolchain and is exercised by the image build below anyway. This
      # job is here to catch type errors, which do not need it.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # Builds without pushing. The Dockerfile asserts that minecraft-data
      # still loads after pruning and that bedrock-protocol still loads after
      # trimming, so a dependency upgrade that breaks either fails here rather
      # than on a running bot.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
